[project]
name = "ads-os-api"
version = "0.1.0"
description = "ADS OS backend — Project Data Core, экономика, слой AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-json-logger>=3.1",
  "httpx>=0.28",
  "selectolax>=0.3.21",
  "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.ruff.lint.per-file-ignores]
# Metric — frozen-датакласс без изменяемого состояния, поэтому общий экземпляр
# по умолчанию безопасен и даже предпочтителен: он один на все поля-заглушки.
"src/ads_os/services/economics.py" = ["RUF009"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Celery не поставляет типы. Ослабление точечное — на сам пакет, а не на наш код.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# Декораторы Celery не типизированы, поэтому строгий режим считает нетипизированной
# и саму задачу. Проверка отключается только для модуля задач: подписи функций в
# нём по-прежнему объявлены и читаются человеком.
[[tool.mypy.overrides]]
module = ["ads_os.worker.tasks.*"]
disable_error_code = ["untyped-decorator"]
