# Проверки на каждый push и pull request.
#
# Смысл этого файла в одном: всё, что описано в README как «должно быть так»,
# должно ломать сборку, когда становится не так. До его появления проверки жили
# только на машине разработчика — то есть выполнялись тогда, когда о них
# вспоминали.
#
# Отдельно стоит проверка расхождения контракта: типы фронтенда генерируются из
# OpenAPI, и молчаливое расхождение между Python и TypeScript всплывает уже в
# рантайме (v0.4 §18).

name: Проверки

on:
  push:
    branches: ["**"]
  pull_request:

# Новый push в ту же ветку отменяет предыдущий прогон: держать очередь из
# устаревших проверок незачем.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Тесты изоляции арендаторов идут против настоящего PostgreSQL. Подменять
    # его SQLite нельзя: проверяется поведение запросов и ограничений, а
    # различия диалектов сделали бы проверку декоративной.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ads_os
          POSTGRES_PASSWORD: ads_os
          POSTGRES_DB: ads_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ads_os:ads_os@127.0.0.1:5432/ads_os_test
      DATABASE_URL: postgresql+asyncpg://ads_os:ads_os@127.0.0.1:5432/ads_os_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Миграции
        working-directory: apps/api
        run: alembic upgrade head

      - name: Стиль и импорты
        working-directory: apps/api
        run: ruff check src tests

      - name: Типы
        working-directory: apps/api
        run: mypy src

      - name: Тесты
        working-directory: apps/api
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка design tokens
        run: pnpm tokens

      - name: Контраст палитры и различимость серий
        run: pnpm lint

      - name: Типы
        run: pnpm -r typecheck

      - name: Форматирование
        run: pnpm format:check

      - name: Сборка
        run: pnpm build

  contract:
    name: Контракт API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: |
          pip install -e "apps/api[dev]"
          pnpm install --frozen-lockfile

      # Схема перегенерируется и сравнивается с той, что лежит в репозитории.
      # Расхождение означает, что backend изменился, а типы фронтенда — нет.
      - name: Расхождение схемы и типов
        env:
          PYTHON: python
        run: bash scripts/check-openapi-drift.sh
