# Стенд ADS OS для Яндекс Облака.
#
# Это staging-стенд, а не production: реальных рекламных кабинетов здесь нет.
# Вход при этом настоящий — через Яндекс ID, с личной учётной записью у каждого
# (см. api/v1/auth.py). Общий пароль на прокси убран: по нему в журнале не было
# видно, кто именно что сделал.
#
# Запуск:
#   cd infra && docker compose --env-file .env up -d --build

name: ads-os

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - web
      - api
    networks:
      - backend

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Пустой адрес API означает относительные пути: браузер обращается к
        # тому же домену, запросы проксирует Caddy. Так исчезает и CORS, и
        # необходимость публиковать backend отдельным адресом.
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - backend

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: staging
      APP_BASE_URL: https://${DOMAIN}
      LOG_LEVEL: info
      # Вход через Яндекс ID. Без этих значений страница входа честно скажет,
      # что вход не настроен, а не покажет неработающую кнопку.
      YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID}
      YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Выбран ChatGPT, но до появления ключа работает детерминированная
      # заглушка. Значение по умолчанию — stub, а не openai: без ключа
      # «openai» означал бы ошибку на каждом вызове.
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Персональные данные наружу не уходят: провайдера для них нет вовсе,
      # и система откажет в запросе, а не отправит его (v0.4 §2.3).
      AI_SENSITIVE_PROVIDER: none
      # Рекламный кабинет не подключается до прохождения проверок безопасности
      # (v0.4 §2.1), даже если токен уже получен. Предохранитель отдельно от
      # переключателя: одного переключения адаптера недостаточно.
      AD_PLATFORM_ADAPTER: ${AD_PLATFORM_ADAPTER:-mock}
      AD_PLATFORM_LIVE_APPROVED: ${AD_PLATFORM_LIVE_APPROVED:-false}
      YANDEX_DIRECT_TOKEN: ${YANDEX_DIRECT_TOKEN:-}
      WORDSTAT_PROVIDER: ${WORDSTAT_PROVIDER:-none}
      YANDEX_WORDSTAT_TOKEN: ${YANDEX_WORDSTAT_TOKEN:-}
      YANDEX_DIRECT_LOGIN: ${YANDEX_DIRECT_LOGIN:-}
      YANDEX_DIRECT_SANDBOX: ${YANDEX_DIRECT_SANDBOX:-true}
      AUTOPILOT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  # Обычный воркер: разбирает результаты и пишет в базу. Наружу не ходит.
  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command:
      ["celery", "-A", "ads_os.worker.app", "worker", "-Q", "default", "--concurrency", "2"]
    restart: unless-stopped
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: stub
      AI_SENSITIVE_PROVIDER: none
      AD_PLATFORM_ADAPTER: mock
    # Проверка живости своя: унаследованная от образа API стучится на порт 8000,
    # которого у воркера нет. Она была бы вечно красной при исправно работающем
    # процессе — а такая проверка хуже отсутствующей, потому что на неё
    # перестают смотреть.
    healthcheck:
      test: ["CMD-SHELL", "celery -A ads_os.worker.app inspect ping -t 5 > /dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  # Планировщик: только ставит задачи по расписанию, сам ничего не выполняет.
  #
  # Отдельный процесс, а не флаг у воркера, по одной причине: воркеров может
  # быть несколько, и с флагом каждый из них заводил бы своё расписание. Один
  # плановый обход превратился бы в три, а клиенты получили бы тройной обход
  # своих сайтов.
  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    # Файл расписания кладётся в /tmp, а не в рабочую папку: она принадлежит
    # root, а процесс работает под обычным пользователем и создать там ничего
    # не может. Без этого beat падает при старте и уходит в вечный перезапуск.
    command:
      [
        "celery",
        "-A",
        "ads_os.worker.app",
        "beat",
        "--loglevel",
        "info",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    # Образ общий с API, а его проверка живости стучится на порт 8000. Beat
    # ничего не обслуживает, порт молчит — и служба вечно числилась бы больной,
    # работая при этом нормально.
    #
    # Процесс ищется по /proc, а не через pgrep: в python-slim нет procps, и
    # проверка на pgrep не выполнялась вовсе — то есть тоже была вечно красной,
    # только по другой причине. Свежесть файла расписания в качестве признака
    # жизни не годится: при недельном расписании beat сбрасывает его на диск
    # редко, и живой планировщик выглядел бы мёртвым.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys;sys.exit(0 if any(b'beat' in open('/proc/'+p+'/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  # Воркер краулера: ходит по чужим сайтам.
  #
  # Он подключён только к сети `crawler`, где нет базы. Это не удобство
  # конфигурации, а требование изоляции (v0.3 §97, v0.4 §20): процесс, который
  # разбирает содержимое произвольного внешнего сайта, не должен иметь никакой
  # возможности дотянуться до данных клиентов — даже если в нём найдут дыру.
  #
  # Адрес базы ему не передаётся намеренно: задача получает адрес страницы
  # аргументом и возвращает результат значением.
  crawler-worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      # Отдельная ступень: этому воркеру нужен браузер, чтобы читать сайты,
      # которые собираются скриптами. Остальным образам он не нужен и стоил бы
      # сотен мегабайт при каждой выкладке.
      target: crawler
    # Одна страница за раз. Браузер занимает сотни мегабайт, и два
    # одновременных на сервере с четырьмя гигабайтами означают отказ всего
    # остального, включая базу.
    command:
      ["celery", "-A", "ads_os.worker.app", "worker", "-Q", "crawler", "--concurrency", "1"]
    restart: unless-stopped
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379/0
    # См. пояснение у обычного воркера: унаследованная проверка стучится на
    # порт, которого здесь нет.
    healthcheck:
      test: ["CMD-SHELL", "celery -A ads_os.worker.app inspect ping -t 5 > /dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crawler

  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Порт наружу не публикуется: база не должна быть доступна из интернета
    # (v0.3 §104).
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Локаль задаётся явно. По умолчанию база создаётся с локалью C, а в ней
      # lower() не понижает регистр кириллицы: «Окна» остаётся «Окна». Для
      # русского продукта это значит, что любое сравнение без учёта регистра
      # молча перестаёт работать. Локаль выбирается один раз при создании базы
      # и потом не меняется, поэтому важно задать её сразу.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # База состоит только в сети backend. В сеть краулера она не входит — это и
    # есть механизм изоляции.
    networks:
      - backend

  # Резервные копии базы (v0.4 §14).
  #
  # Отдельный контейнер с тем же образом Postgres — ради pg_dump той же версии.
  # Дамп, снятый клиентом другой версии, восстанавливается не всегда, и узнают
  # об этом в единственный момент, когда это критично.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      # Копии лежат в каталоге рядом с проектом, а не в томе Docker: том можно
      # снести одной командой вместе со всем остальным, а каталог виден и
      # копируется на другую машину обычным scp.
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Очередь — единственное, что видно из обеих сетей: через неё воркер
    # краулера получает задания и отдаёт результат.
    networks:
      - backend
      - crawler

networks:
  # Основная сеть: приложение и его данные.
  backend:
  # Сеть краулера. Базы здесь нет — только очередь. Контейнер краулера
  # физически не может обратиться к postgres, потому что не состоит с ним ни в
  # одной общей сети.
  crawler:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
